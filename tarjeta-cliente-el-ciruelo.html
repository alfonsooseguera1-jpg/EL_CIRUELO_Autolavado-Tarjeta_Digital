<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>El Ciruelo · Mi Tarjeta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --plum:#6B2D5C; --plum-dark:#4A1F40; --aqua:#2EC4B6; --yellow:#FFC53D;
    --cream:#FFF8F0; --ink:#2B1B26; --ink-soft:#7A6873; --line:#EEE1E7; --danger:#D64545;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #F3E3EE 0%, transparent 45%),
      radial-gradient(circle at 100% 20%, #DFF5F2 0%, transparent 40%),
      var(--cream);
    min-height:100vh; font-family:'Nunito', sans-serif; color:var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{ max-width:460px; margin:0 auto; padding:22px 16px 60px; }
  header{ text-align:center; margin-bottom:18px; }
  .plum-badge{
    width:56px;height:56px; margin:0 auto 8px;
    border-radius:50% 50% 50% 4px;
    background:linear-gradient(145deg,var(--plum),var(--plum-dark));
    display:flex;align-items:center;justify-content:center; font-size:26px;
    transform:rotate(-8deg); box-shadow:0 6px 14px rgba(107,45,92,0.35);
  }
  h1{ font-family:'Baloo 2',sans-serif; font-size:26px; font-weight:800; margin:4px 0 2px; color:var(--plum-dark); }
  .sub{ font-size:13.5px; color:var(--ink-soft); font-weight:600; }
  .card{ background:#fff; border:2px solid var(--line); border-radius:20px; padding:20px; margin-bottom:16px; }
  label{ display:block; font-size:13px; font-weight:800; color:var(--plum-dark); margin-bottom:6px; }
  input{
    width:100%; padding:12px 14px; border:2px solid var(--line); border-radius:12px;
    font-size:16px; font-family:'Nunito',sans-serif; font-weight:700; color:var(--ink);
    margin-bottom:14px; outline:none; transition:border-color .15s; text-transform:uppercase; letter-spacing:2px;
  }
  input:focus{ border-color:var(--aqua); }
  button.primary{
    width:100%; padding:13px; border:none; border-radius:12px; background:var(--aqua); color:#fff;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15.5px; cursor:pointer;
    box-shadow:0 4px 10px rgba(46,196,182,0.35); transition:transform .1s;
  }
  button.primary:active{ transform:scale(0.97); }
  .msg{ font-size:13.5px; font-weight:700; padding:10px 12px; border-radius:10px; margin-bottom:14px; }
  .msg.err{ background:#FCE9E9; color:var(--danger); }
  .msg.ok{ background:#E4F8EC; color:#1F8A4C; }
  .msg.info{ background:#F3ECF1; color:var(--plum-dark); }
  .client-name{ font-family:'Baloo 2',sans-serif; font-size:19px; font-weight:700; color:var(--plum-dark); margin-bottom:2px; }
  .client-plate{
    display:inline-block; font-size:13px; letter-spacing:2px; font-weight:800;
    color:#fff; background:var(--ink); padding:3px 10px; border-radius:6px; margin-bottom:16px;
  }
  .stamps{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:6px; }
  .stamp{ aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; border:2.5px dashed var(--line); background:#FAF6F3; }
  .stamp.filled{ border-style:solid; border-color:var(--plum); background:linear-gradient(145deg,var(--plum),var(--plum-dark)); box-shadow:0 4px 10px rgba(107,45,92,0.35); }
  .stamp.gift{ border-color:var(--yellow); background:linear-gradient(145deg,#FFD766,var(--yellow)); }
  .progress-txt{ text-align:center; font-weight:800; color:var(--plum-dark); font-size:14.5px; margin-bottom:4px; }
  .reward-banner{ background:linear-gradient(120deg,var(--yellow),#FFB347); border-radius:14px; padding:14px; text-align:center; font-family:'Baloo 2',sans-serif; font-weight:800; color:#5A3B00; margin-bottom:16px; }
  .footer-note{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:22px; line-height:1.5; }
  .spinner{ display:inline-block; width:14px;height:14px; border:2.5px solid rgba(107,45,92,.3); border-top-color:var(--plum); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="plum-badge">🍑</div>
    <h1>Autolavado El Ciruelo</h1>
    <div class="sub">Tarjeta digital de sellos · Pajacuarán</div>
  </header>

  <div class="card">
    <label for="clientePlate">Placa de tu vehículo</label>
    <input id="clientePlate" type="text" placeholder="Ej. ABC1234" maxlength="8">
    <button class="primary" onclick="checkClient()">Ver mis sellos</button>
  </div>
  <div id="clienteMsg"></div>
  <div id="clienteResult"></div>

  <div class="footer-note">
    En la lavada #6, la lavada es gratis 🎁<br>
    ¿No tienes sellos todavía? Pídele a nuestro personal que te registre en tu próxima visita.
  </div>
</div>

<script>
const TOTAL_STAMPS = 6;

// 👉 Pega aquí el link de tu hoja "Publico" publicada como CSV
// (Archivo > Compartir > Publicar en la web > pestaña "Publico" > formato CSV)
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpBFYcVXD0GoY_loWS0mdy7iTOiJLDzeGry1iuqGcFWJCbTF_trIrpGuf9ouhcaKKQ19z35Fe12E7s/pub?gid=1099525870&single=true&output=csv";

function showMsg(text, type){ document.getElementById('clienteMsg').innerHTML = `<div class="msg ${type}">${text}</div>`; }
function clearMsg(){ document.getElementById('clienteMsg').innerHTML = ''; }

function stampsHTML(stamps){
  let html = '<div class="stamps">';
  for(let i=1;i<=TOTAL_STAMPS;i++){
    if(i===TOTAL_STAMPS){
      html += `<div class="stamp ${stamps>=TOTAL_STAMPS?'gift':''}">🎁</div>`;
    } else {
      html += `<div class="stamp ${i<=stamps?'filled':''}">${i<=stamps?'💧':''}</div>`;
    }
  }
  html += '</div>';
  return html;
}

async function checkClient(){
  clearMsg();
  document.getElementById('clienteResult').innerHTML = '';
  const plate = (document.getElementById('clientePlate').value || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(plate.length < 5){
    showMsg('Escribe una placa válida.','err');
    return;
  }
  if(SHEET_CSV_URL.includes('PEGA_AQUI')){
    showMsg('Esta app todavía no está conectada a la hoja de Google Sheets. Avísale al dueño del negocio.','err');
    return;
  }
  showMsg('<span class="spinner"></span> Buscando tu tarjeta...','info');
  try{
    const res = await fetch(SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 'cachebust=' + Date.now());
    const text = await res.text();
    const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
    const row = parsed.data.find(r => (r['Placa']||'').toString().toUpperCase().replace(/[^A-Z0-9]/g,'') === plate);
    clearMsg();
    if(!row){
      showMsg('Aún no tienes sellos con esa placa. ¡Ven a lavar tu auto y pide tu primer sello! 🚗💦','info');
      return;
    }
    const stamps = parseInt(row['Sellos actuales'], 10) || 0;
    const ready = stamps >= TOTAL_STAMPS;
    let html = `<div class="card">
      <div class="client-name">${row['Nombre'] || 'Cliente'} 👋</div>
      <div class="client-plate">${plate}</div>`;
    if(ready){
      html += `<div class="reward-banner">🎉 ¡Tienes tu lavada #6 GRATIS! Muéstrale esta pantalla al personal.</div>`;
    } else {
      html += `<div class="progress-txt">${stamps} de ${TOTAL_STAMPS} sellos · Te faltan ${TOTAL_STAMPS-stamps}</div>`;
    }
    html += stampsHTML(stamps) + `</div>`;
    document.getElementById('clienteResult').innerHTML = html;
  }catch(e){
    clearMsg();
    showMsg('No se pudo conectar. Revisa tu internet e intenta de nuevo.','err');
  }
}

document.getElementById('clientePlate').addEventListener('keydown', e => { if(e.key==='Enter') checkClient(); });
</script>
</body>
</html>
